services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hypertube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-hypertube}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hypertube}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  vpn:
    image: qmcgaw/gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      VPN_TYPE: openvpn
      OPENVPN_USER: ${PIA_USER}
      OPENVPN_PASSWORD: ${PIA_PASSWORD}
      SERVER_REGIONS: ${PIA_REGION:-france}
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://ipinfo.io"]
      interval: 10s
      timeout: 5s
      retries: 5

  torrent-transcode:
    build: ./services/torrent-transcode
    restart: unless-stopped
    env_file: .env
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - ./data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - api

volumes:
  pgdata:
