name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/requirements/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: srcs/requirements/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  torrent-stream:
    name: Torrent stream (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/requirements/torrent-transcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: srcs/requirements/torrent-transcode/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
