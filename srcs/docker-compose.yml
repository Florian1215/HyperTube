services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./requirements/db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hypertube}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./requirements/api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - frontend_net
    ports:
      - "8080:8794"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./requirements/frontend
      args:
        NEXT_PUBLIC_TMDB_API_KEY: ${TMDB_API_KEY}
        NEXT_PUBLIC_OPENSUBTITLES_API_KEY: ${NEXT_PUBLIC_OPENSUBTITLES_API_KEY}
        NEXT_PUBLIC_OPENSUBTITLES_USERNAME: ${NEXT_PUBLIC_OPENSUBTITLES_USERNAME}
        NEXT_PUBLIC_OPENSUBTITLES_PASSWORD: ${NEXT_PUBLIC_OPENSUBTITLES_PASSWORD}
    restart: unless-stopped
    ports:
      - "4200:4200"
    networks:
      - frontend_net
    depends_on:
      - api

networks:
  frontend_net:

volumes:
  pgdata:
