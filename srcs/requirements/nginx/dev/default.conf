# Docker's embedded DNS: upstreams are resolved per request, so nginx
# keeps working when the api or frontend container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme given by a TLS-terminating proxy in front of nginx
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Profile pictures are limited to 5 MB by the API
    client_max_body_size 10m;
    # Keep the published port in redirects issued by nginx
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Django: API, admin and the admin's static files
    location ~ ^/(api|admin|static)/ {
        set $api http://api:8000;
        proxy_pass $api;
        # Streams and torrent files are long-lived responses
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Next.js (the upgrade headers are needed for HMR in development)
    location / {
        set $frontend http://frontend:4200;
        proxy_pass $frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
