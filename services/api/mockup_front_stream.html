<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HyperTube — dev player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; padding: 32px 16px; }
    h1 { font-size: 1rem; letter-spacing: 0.05em; opacity: 0.5; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; background: #1e1e1e; border: 1px solid #333; color: #eee; padding: 6px 10px; border-radius: 4px; font-family: sans-serif; font-size: 0.9rem; width: 260px; }
    button { background: #e50914; border: none; color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    button:hover { background: #f40612; }
    pre { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; padding: 12px; font-size: 0.75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; min-height: 48px; max-height: 180px; overflow-y: auto; color: #7ec8e3; width: min(860px, 95vw); }
    video { width: min(860px, 95vw); background: #000; border-radius: 6px; }
    #status { font-size: 0.8rem; opacity: 0.5; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>torrent-stream / dev player</h1>

  <div class="row">
    <input id="imdbInput" type="text" placeholder="imdb id — e.g. tt0372784" />
    <button onclick="fetchTorrents()">Fetch torrents</button>
  </div>
  <pre id="torrentsOutput">—</pre>

  <div class="row">
    <input id="torrentIdInput" type="text" placeholder="torrent id" />
    <button onclick="play()">Play</button>
  </div>

  <video id="video" controls></video>
  <div id="status"></div>

  <script>
    const BASE = window.location.origin;
    const status = document.getElementById('status');
    const video  = document.getElementById('video');
    let hls = null;

    async function fetchTorrents() {
      const id = document.getElementById('imdbInput').value.trim();
      if (!id) return;
      const out = document.getElementById('torrentsOutput');
      out.textContent = 'fetching…';
      try {
        const res  = await fetch(`${BASE}/api/v1/movies/${id}/torrents`);
        const body = await res.json();
        out.textContent = JSON.stringify(body, null, 2);
        if (body.data?.length === 1)
          document.getElementById('torrentIdInput').value = body.data[0].id ?? body.data[0].ID ?? '';
      } catch (e) {
        out.textContent = `error: ${e.message}`;
      }
    }

    async function play() {
      const id = document.getElementById('torrentIdInput').value.trim();
      if (!id) { status.textContent = 'enter a torrent id first'; return; }

      if (hls) { hls.destroy(); hls = null; }
      video.src = '';
      status.textContent = 'Initialising stream…';

      const init = await fetch(`${BASE}/api/v1/stream/${id}`);
      if (!init.ok) { status.textContent = `Init failed: ${init.status}`; return; }

      const indexUrl = `${BASE}/api/v1/stream/${id}/index`;
      status.textContent = 'Loading playlist…';

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(indexUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          status.textContent = 'Playing via hls.js';
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) status.textContent = `HLS error: ${data.type}`;
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = indexUrl;
        video.addEventListener('loadedmetadata', () => { video.play(); });
        status.textContent = 'Playing via native HLS';
      } else {
        status.textContent = 'HLS not supported in this browser';
      }
    }

    document.getElementById('imdbInput').addEventListener('keydown', e => e.key === 'Enter' && fetchTorrents());
    document.getElementById('torrentIdInput').addEventListener('keydown', e => e.key === 'Enter' && play());
  </script>
</body>
</html>
